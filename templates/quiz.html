{% extends "base.html" %}
{% block title %}
	Quiz
{% endblock title %}

{% block body %}

		<p>{{question.question_text}}</p>
		<form action="" method="post">
			{{form.hidden_tag()}}
			{% for choice in form.answer %}
				<div>
					{{choice}}
					{{choice.label}}
				</div>
			{% endfor %}
			{{form.submit(value = "Next")}}
		</form>
	<a href="{{prev}}">Prev Question</a>

{% endblock body %}
