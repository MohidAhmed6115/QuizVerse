{% extends "base.html" %}

{% block title %}
	Sign Up
{% endblock title %}

{% block body %}
	<div class="min-h-screen w-full flex flex-col items-center justify-center bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 px-4">

		<div class="w-full max-w-sm bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8 flex flex-col items-center">

			<img class="rounded-full aspect-square object-cover border-4 border-white shadow-md -mt-16 mb-4" src="{{ url_for('static', filename='assets/sign-up-img.png') }}" alt="Login Image" width="110" height="110">

			<h1 class="text-2xl font-extrabold text-gray-800 mb-1">Welcome Back</h1>
			<p class="text-sm text-gray-500 mb-6">Log in and test your knowledge</p>

			<form id="loginForm" action="/login" method="post" class="w-full flex flex-col gap-4">

				<input class="w-full rounded-lg border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-400" type="text" name="email" id="username" placeholder="Enter Your Email">
				<input class="w-full rounded-lg border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-400" type="text" name="username" id="username" placeholder="Enter your Username">

				<input class="w-full rounded-lg border border-gray-200 px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-400" type="password" name="user_pass" id="user_pass" placeholder="Enter Your Password">

				<button class="w-full rounded-lg bg-purple-600 hover:bg-purple-700 transition-colors text-white font-semibold py-2.5 mt-2" type="submit">LOGIN</button>
			</form>

			<p class="text-sm text-gray-500 mt-6">Already have an account? <a class="text-purple-600 font-semibold hover:underline" href="/login">Login</a></p>
		</div>

	</div>
{% endblock body %}
